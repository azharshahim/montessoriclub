<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <meta name="description" content="Montessori Club : activités Montessori calmes et progressives pour les enfants de 0 à 12 ans. Sans publicité, sans achat, sans collecte de données." />
    <meta name="theme-color" content="#EE6C5B" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1B1917" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="referrer" content="no-referrer" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Installation sur mobile (PWA) -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="icon" href="./favicon.ico" sizes="any" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Montessori" />

    <title>%WEB_TITLE%</title>

    <!-- Réinitialisation recommandée par react-native-web -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        margin: 0;
        background-color: #fff9f0;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background-color: #1b1917;
        }
      }
      /* Écran de démarrage : évite tout flash blanc pendant le chargement du bundle. */
      #boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: linear-gradient(160deg, #fff9f0 0%, #fdefdf 100%);
        color: #33302e;
        font-family: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, sans-serif;
        text-align: center;
        padding: 24px;
      }
      #boot-splash img {
        width: 96px;
        height: 96px;
        border-radius: 24px;
        box-shadow: 0 10px 26px rgba(74, 55, 42, 0.18);
      }
      #boot-splash strong {
        font-size: 20px;
        font-weight: 800;
      }
      #boot-splash span {
        font-size: 14px;
        opacity: 0.65;
      }
      @media (prefers-color-scheme: dark) {
        #boot-splash {
          background: linear-gradient(160deg, #1b1917 0%, #23201d 100%);
          color: #f6f0e8;
        }
      }
    </style>
  </head>

  <body>
    <noscript>
      Montessori Club a besoin de JavaScript pour fonctionner. Active-le dans les réglages de ton navigateur.
    </noscript>
    <div id="root">
      <div id="boot-splash">
        <img src="./icons/icon-192.png" alt="" width="96" height="96" />
        <strong>Montessori Club</strong>
        <span>Un instant, on prépare les activités…</span>
      </div>
    </div>
  </body>
</html>
