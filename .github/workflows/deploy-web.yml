name: Déploiement Web (GitHub Pages)

# Publie automatiquement la version Web sur GitHub Pages à chaque push sur main.
# URL obtenue : https://<utilisateur>.github.io/<nom-du-depot>/
#
# Prérequis (une seule fois) :
#   Settings → Pages → Source : « GitHub Actions »

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Expo Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Brancher les images réalistes (assets/photos/objects)
        run: npm run photos

      - name: Vérification TypeScript
        run: npx tsc --noEmit

      - name: Export statique
        env:
          # Les assets doivent être servis depuis /<nom-du-depot>/
          EXPO_BASE_URL: /${{ github.event.repository.name }}
        run: npx expo export --platform web --output-dir dist

      - name: Traductions fr / en / ar
        run: npm run test:i18n

      - name: Service worker et hors ligne
        # Le chemin de base est vérifié dans le build publié (/<nom-du-depot>/).
        env:
          EXPO_BASE_URL: /${{ github.event.repository.name }}
        run: npm run test:sw

      - name: Parcours complet (thème clair)
        run: npm run test:web

      - name: Parcours complet (thème sombre)
        run: npm run test:web
        env:
          DARK: '1'

      - name: Repli SPA et fichiers Pages
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publier
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
